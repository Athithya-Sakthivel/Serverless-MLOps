# Reusable CI template for Python services.

parameters:
  - name: serviceDirectory
    type: string
  - name: pythonVersion
    type: string
    default: '3.14'
  - name: requirementsFile
    type: string
  - name: devRequirementsFile
    type: string
  - name: includeDocker
    type: boolean
    default: false
  - name: containerRepository
    type: string
    default: ''
  - name: dockerfilePath
    type: string
    default: ''
  - name: preTestSteps
    type: stepList
    default: []

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.pythonVersion }}'
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'
      architecture: 'x64'

  - task: Cache@2
    displayName: 'Cache pip'
    inputs:
      key: 'pip | "$(Agent.OS)" | "python-${{ parameters.pythonVersion }}" | $(Build.SourcesDirectory)/${{ parameters.requirementsFile }} | $(Build.SourcesDirectory)/${{ parameters.devRequirementsFile }}'
      restoreKeys: |
        pip | "$(Agent.OS)" | "python-${{ parameters.pythonVersion }}"
        pip | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.cache/pip

  - bash: |
      set -euo pipefail
      python -m venv .venv
      source .venv/bin/activate
      python -m pip install --upgrade pip setuptools wheel
      pip install --cache-dir "$(Pipeline.Workspace)/.cache/pip" \
        -r "$(Build.SourcesDirectory)/${{ parameters.requirementsFile }}" \
        -r "$(Build.SourcesDirectory)/${{ parameters.devRequirementsFile }}"
      python -m pip check
    displayName: 'Install dependencies'
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

  - bash: |
      set -euo pipefail
      source .venv/bin/activate
      ruff check "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'Ruff lint'

  - bash: |
      set -euo pipefail
      source .venv/bin/activate
      ruff format --check "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'Ruff format check'

  - bash: |
      set -euo pipefail
      source .venv/bin/activate
      basedpyright "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'basedpyright type-check'

  - ${{ each step in parameters.preTestSteps }}:
    - ${{ step }}

  - bash: |
      set -euo pipefail
      source .venv/bin/activate
      pytest "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}/tests" \
        -v \
        --junitxml="$(Build.SourcesDirectory)/test-results.xml"
    displayName: 'Run tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      testRunTitle: '${{ parameters.serviceDirectory }} tests'

  - bash: |
      set -euo pipefail
      source .venv/bin/activate
      mkdir -p "$(Build.ArtifactStagingDirectory)/security"
      pip-audit -f json -o "$(Build.ArtifactStagingDirectory)/security/pip-audit.json"
    displayName: 'Dependency vulnerability audit'

  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/security"

      TRIVY_VERSION='0.72.0'
      curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
        -o /tmp/trivy.tar.gz \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      chmod +x /tmp/trivy

      JSON_REPORT="$(Build.ArtifactStagingDirectory)/security/trivy-fs.json"
      SARIF_REPORT="$(Build.ArtifactStagingDirectory)/security/trivy-fs.sarif"
      TARGET_DIR="$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
      rm -f "$JSON_REPORT" "$SARIF_REPORT"

      set +e
      /tmp/trivy fs \
        --scanners vuln \
        --detection-priority comprehensive \
        --format json \
        --output "$JSON_REPORT" \
        "$TARGET_DIR"
      scan_rc=$?
      set -e

      if [ "$scan_rc" -ne 0 ]; then
        echo "Trivy filesystem scan failed (exit ${scan_rc})."
        exit "$scan_rc"
      fi

      if [ ! -s "$JSON_REPORT" ]; then
        echo "Trivy did not produce a JSON report."
        exit 1
      fi

      /tmp/trivy convert \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format table \
        "$JSON_REPORT"

      /tmp/trivy convert \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format sarif \
        --output "$SARIF_REPORT" \
        "$JSON_REPORT"

      python3 -c "
import json, sys
from collections import Counter

with open('$JSON_REPORT') as f:
    report = json.load(f)

findings = []
for result in report.get('Results') or []:
    target = result.get('Target') or 'unknown'
    for vuln in result.get('Vulnerabilities') or []:
        severity = (vuln.get('Severity') or '').upper()
        if severity in {'HIGH', 'CRITICAL'}:
            findings.append((target, vuln))

if not findings:
    print(0)
    sys.exit(0)

print(len(findings))
print(f'Trivy policy findings: {len(findings)} HIGH/CRITICAL vulnerability(s).')
print()

by_target = {}
for target, vuln in findings:
    by_target.setdefault(target, []).append(vuln)

for target, vulns in by_target.items():
    counts = Counter((v.get('Severity') or 'UNKNOWN').upper() for v in vulns)
    parts = [f'{s}: {counts[s]}' for s in ('CRITICAL', 'HIGH') if counts[s]]
    print(f'- {target} ({', '.join(parts)})')
    for vuln in vulns[:5]:
        vid = vuln.get('VulnerabilityID', 'unknown')
        pkg = vuln.get('PkgName', 'unknown')
        installed = vuln.get('InstalledVersion', '?')
        fixed = vuln.get('FixedVersion', 'unfixed')
        title = vuln.get('Title', '')
        print(f'  - {vid} | {pkg} | installed: {installed} | fixed: {fixed}')
        if title:
            print(f'    {title}')
    remaining = len(vulns) - 5
    if remaining > 0:
        print(f'  - ... {remaining} more')
"

      if [ "$findings_total" -gt 0 ]; then
        echo
        echo "SARIF report: $SARIF_REPORT"
        exit 1
      fi

      echo "Trivy policy findings: 0 HIGH/CRITICAL vulnerability(s)."
      echo "SARIF report: $SARIF_REPORT"
    displayName: 'Trivy filesystem scan'

  - ${{ if eq(parameters.includeDocker, true) }}:
    - task: AzureCLI@2
      displayName: 'Authenticate Docker to ACR'
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
      inputs:
        azureSubscription: 'azdo-oidc-ci'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          az acr login --name "$(containerRegistry)"

    - bash: |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        ROOT="$(Build.SourcesDirectory)"
        CONTEXT="$ROOT/${{ parameters.serviceDirectory }}"
        IMAGE="$(containerRegistry).azurecr.io/${{ parameters.containerRepository }}:$(Build.SourceVersion)"
        docker buildx rm ci-builder >/dev/null 2>&1 || true
        docker buildx create --name ci-builder --use >/dev/null
        docker buildx inspect --bootstrap >/dev/null
        if [ "${BUILD_SOURCEBRANCH}" = "refs/heads/main" ]; then
          CACHE_REF="$(containerRegistry).azurecr.io/build-cache/${{ parameters.containerRepository }}:buildcache"
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            --label org.opencontainers.image.revision="$(Build.SourceVersion)" \
            --file "$ROOT/${{ parameters.dockerfilePath }}" \
            --tag "$IMAGE" \
            "$CONTEXT"
        else
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            --label org.opencontainers.image.revision="$(Build.SourceVersion)" \
            --file "$ROOT/${{ parameters.dockerfilePath }}" \
            --tag "$IMAGE" \
            "$CONTEXT"
        fi
      displayName: 'Build container image'

    - bash: |
        set -euo pipefail
        IMAGE="$(containerRegistry).azurecr.io/${{ parameters.containerRepository }}:$(Build.SourceVersion)"
        mkdir -p "$(Build.ArtifactStagingDirectory)/security"
        /tmp/trivy image \
          --scanners vuln \
          --format sarif \
          --output "$(Build.ArtifactStagingDirectory)/security/trivy-image.sarif" \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          "$IMAGE"
      displayName: 'Scan container image'

    - task: AzureCLI@2
      displayName: 'Push image and generate manifest'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        azureSubscription: 'azdo-oidc-ci'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          REGISTRY="$(containerRegistry)"
          REPO="${{ parameters.containerRepository }}"
          TAG="$(Build.SourceVersion)"
          IMAGE="${REGISTRY}.azurecr.io/${REPO}:${TAG}"
          az acr login --name "$REGISTRY"
          docker push "$IMAGE"
          mkdir -p "$(Build.ArtifactStagingDirectory)/deploy-manifest"
          python "$(Build.SourcesDirectory)/src/scripts/push_manifest.py" \
            --registry "$REGISTRY" \
            --repository "$REPO" \
            --tag "$TAG" \
            --image "$IMAGE" \
            --build-id "$(Build.BuildId)" \
            --output "$(Build.ArtifactStagingDirectory)/deploy-manifest/deploy-manifest.json"

    - task: PublishPipelineArtifact@1
      displayName: 'Publish deploy manifest'
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/deploy-manifest'
        artifact: 'deploy-manifest'
        publishLocation: 'pipeline'