# ---------------------------------------------------------------------------
# Reusable CI template for Python services – two‑venv strategy
#
# Creates two separate virtual environments to avoid dependency conflicts:
#   • .venv-prod  – only production requirements (used for pip check & audit)
#   • .venv-ci    – production + CI tools (used for lint, type‑check, tests)
#
# Parameters:
#   serviceDirectory     – path relative to repo root (e.g. src/workloads/…)
#   pythonVersion        – Python version to install
#   requirementsFile     – production requirements file
#   devRequirementsFile  – CI‑only requirements file (ruff, basedpyright, pytest, pip‑audit)
#   includeDocker        – not used in CI; kept for backwards compatibility
#   preTestSteps         – optional extra steps inserted before pytest
# ---------------------------------------------------------------------------

parameters:
  - name: serviceDirectory
    type: string
  - name: pythonVersion
    type: string
    default: '3.14'
  - name: requirementsFile
    type: string
  - name: devRequirementsFile
    type: string
  - name: includeDocker
    type: boolean
    default: false
  - name: containerRepository
    type: string
    default: ''
  - name: dockerfilePath
    type: string
    default: ''
  - name: preTestSteps
    type: stepList
    default: []

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: UsePythonVersion@0
    displayName: 'Use Python ${{ parameters.pythonVersion }}'
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'
      architecture: 'x64'

  # --------------------------------------------------------------------------
  # Pip cache – keyed on both requirements files
  # --------------------------------------------------------------------------
  - task: Cache@2
    displayName: 'Cache pip packages'
    inputs:
      key: 'pip | "$(Agent.OS)" | "python-${{ parameters.pythonVersion }}" | $(Build.SourcesDirectory)/${{ parameters.requirementsFile }} | $(Build.SourcesDirectory)/${{ parameters.devRequirementsFile }}'
      restoreKeys: |
        pip | "$(Agent.OS)" | "python-${{ parameters.pythonVersion }}"
        pip | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.cache/pip

  # --------------------------------------------------------------------------
  # 1. Production virtual environment – only production deps
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      python -m venv .venv-prod
      source .venv-prod/bin/activate
      python -m pip install --upgrade pip setuptools wheel
      pip install --cache-dir "$(Pipeline.Workspace)/.cache/pip" \
        -r "$(Build.SourcesDirectory)/${{ parameters.requirementsFile }}"
      python -m pip check
    displayName: 'Install production dependencies'
    workingDirectory: $(Build.SourcesDirectory)
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

  # --------------------------------------------------------------------------
  # 2. CI virtual environment – production + CI tools
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      python -m venv .venv-ci
      source .venv-ci/bin/activate
      python -m pip install --upgrade pip setuptools wheel
      pip install --cache-dir "$(Pipeline.Workspace)/.cache/pip" \
        -r "$(Build.SourcesDirectory)/${{ parameters.requirementsFile }}" \
        -r "$(Build.SourcesDirectory)/${{ parameters.devRequirementsFile }}"
      python -m pip check
    displayName: 'Install CI dependencies'
    workingDirectory: $(Build.SourcesDirectory)
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

  # --------------------------------------------------------------------------
  # Linting & formatting (uses CI venv)
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      source .venv-ci/bin/activate
      ruff check "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'Ruff lint'
    workingDirectory: $(Build.SourcesDirectory)

  - bash: |
      set -euo pipefail
      source .venv-ci/bin/activate
      ruff format --check "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'Ruff format check'
    workingDirectory: $(Build.SourcesDirectory)

  # --------------------------------------------------------------------------
  # Type‑checking (uses CI venv)
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      source .venv-ci/bin/activate
      basedpyright "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
    displayName: 'basedpyright type-check'
    workingDirectory: $(Build.SourcesDirectory)

  # --------------------------------------------------------------------------
  # Optional pre‑test steps (e.g. smoke tests)
  # --------------------------------------------------------------------------
  - ${{ each step in parameters.preTestSteps }}:
    - ${{ step }}

  # --------------------------------------------------------------------------
  # Unit tests (uses CI venv)
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      source .venv-ci/bin/activate
      pytest "$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}/tests" \
        -v \
        --junitxml="$(Build.SourcesDirectory)/test-results.xml"
    displayName: 'Run tests'
    workingDirectory: $(Build.SourcesDirectory)

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      testRunTitle: '${{ parameters.serviceDirectory }} tests'
      
  # --------------------------------------------------------------------------
  # Trivy filesystem scan (no venv needed)
  # --------------------------------------------------------------------------
  - bash: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/security"

      TRIVY_VERSION='0.72.0'
      curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
        -o /tmp/trivy.tar.gz \
        "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      chmod +x /tmp/trivy

      JSON_REPORT="$(Build.ArtifactStagingDirectory)/security/trivy-fs.json"
      SARIF_REPORT="$(Build.ArtifactStagingDirectory)/security/trivy-fs.sarif"
      TARGET_DIR="$(Build.SourcesDirectory)/${{ parameters.serviceDirectory }}"
      rm -f "$JSON_REPORT" "$SARIF_REPORT"

      set +e
      /tmp/trivy fs \
        --scanners vuln \
        --detection-priority comprehensive \
        --format json \
        --output "$JSON_REPORT" \
        "$TARGET_DIR"
      scan_rc=$?
      set -e

      if [ "$scan_rc" -ne 0 ]; then
        echo "Trivy filesystem scan failed (exit ${scan_rc})."
        exit "$scan_rc"
      fi

      if [ ! -s "$JSON_REPORT" ]; then
        echo "Trivy did not produce a JSON report."
        exit 1
      fi

      /tmp/trivy convert \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format table \
        "$JSON_REPORT"

      /tmp/trivy convert \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format sarif \
        --output "$SARIF_REPORT" \
        "$JSON_REPORT"

      findings_total=$(python3 "$(Build.SourcesDirectory)/src/scripts/trivy_report.py" "$JSON_REPORT")
      rc=$?
      if [ "$rc" -ne 0 ]; then
        echo
        echo "SARIF report: $SARIF_REPORT"
        exit "$rc"
      fi

      echo "Trivy policy findings: 0 HIGH/CRITICAL vulnerability(s)."
      echo "SARIF report: $SARIF_REPORT"
    displayName: 'Trivy filesystem scan'