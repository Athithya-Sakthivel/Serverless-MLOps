# ---------------------------------------------------------------------------
# Reusable template – update an Azure Container App Job image
#
# Parameters:
#   containerAppJobName : name of the ACA Job
#   resourceGroup       : resource group
#   image               : full image reference (e.g. myacr.azurecr.io/repo:tag)
#   azureServiceConnection : Azure DevOps service connection name
# ---------------------------------------------------------------------------
parameters:
  - name: containerAppJobName
    type: string
  - name: resourceGroup
    type: string
  - name: image
    type: string
  - name: azureServiceConnection
    type: string

steps:
  - task: AzureCLI@2
    displayName: 'Update ACA Job image'
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        az containerapp job update \
          --name "${{ parameters.containerAppJobName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --image "${{ parameters.image }}" \
          --output none

        echo "Updated job image to ${{ parameters.image }}"