# ---------------------------------------------------------------------------
# CI – Terraform Plan & Validate
#
# Runs `tofu plan` – does NOT apply.  Publishes plan artifact for audit.
# The Azure DevOps PAT is fetched from Key Vault at runtime.
# ---------------------------------------------------------------------------

trigger:
  batch: true
  branches:
    include:
      - main
      - feat/*
  paths:
    include:
      - src/terraform/main/**
      - azure-pipelines/ci/ci-terraform.yaml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

# ──────────────────────────────────────────────────────────────────────────
# Non‑secret values come from the Terraform‑managed variable group.
# Secrets are fetched from Key Vault.
# ──────────────────────────────────────────────────────────────────────────
variables:
  - group: sm-all-vars                              # TF_VAR_location, TF_VAR_alert_email_address, AZDO_ORG_SERVICE_URL
  - name: kvName
    value: 'kv-bootstrap-${TF_VAR_subscription_id_suffix}'   # placeholder – actual name set via env or hardcoded

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  # ------------------------------------------------------------------------
  # Fetch the Azure DevOps PAT from Key Vault
  # ------------------------------------------------------------------------
  - task: AzureKeyVault@2
    displayName: 'Fetch azdo-pat from Key Vault'
    inputs:
      azureSubscription: 'azdo-oidc-ci'             # CI service connection has KV Secrets User role
      KeyVaultName: $(kvName)
      SecretsFilter: 'azdo-pat'
      RunAsPreJob: true                             # secret available to all subsequent tasks

  # ------------------------------------------------------------------------
  # Run tofu plan
  # ------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/src/terraform/main"
        chmod +x ./run.sh

        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_OIDC="true"
        export TF_INPUT="false"

        ./run.sh --plan --env staging
    env:
      # Inject non‑secret config and the PAT (fetched from Key Vault) into the shell
      AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
      AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)

  # ------------------------------------------------------------------------
  # Publish plan for audit (CD does NOT use this – it runs its own plan+apply)
  # ------------------------------------------------------------------------
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Terraform plan (audit only)'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/src/terraform/main/.plans/staging'
      artifact: 'terraform-plan'