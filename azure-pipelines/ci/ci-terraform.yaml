# =============================================================================
# CI – Terraform Plan & Validate
#
# Runs `tofu plan` – does NOT apply.  The plan output is for audit only.
#
# The Azure DevOps PAT is fetched from the bootstrap Key Vault at runtime.
# No secrets are stored in variable groups.
#
# Before planning, the state file is refreshed from live Azure resources.
# This heals any state drift caused by previous targeted applies (e.g. the
# CD pipeline's --skip-aca phase), so the plan always sees current values.
# The refresh step calls run.sh --refresh, which handles tofu installation
# and backend initialisation automatically.
# =============================================================================

trigger:
  batch: true
  branches:
    include:
      - main
      - feat/*
  paths:
    include:
      - src/terraform/main/**
      - azure-pipelines/ci/ci-terraform.yaml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: terraform-vars          # TF_VAR_location, TF_VAR_alert_email_address,
                                   # AZDO_ORG_SERVICE_URL

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  # --------------------------------------------------------------------------
  # Derive the bootstrap Key Vault name from the subscription ID.
  # The Key Vault always follows the pattern kv-azdo-bootstrap-<suffix>.
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Derive Key Vault name'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        KV_NAME="kv-azdo-bootstrap-${SUBSCRIPTION_ID: -6}"
        echo "Key Vault: ${KV_NAME}"
        echo "##vso[task.setvariable variable=kvName]${KV_NAME}"

  # --------------------------------------------------------------------------
  # Fetch the Azure DevOps PAT from the bootstrap Key Vault.
  # The CI service principal (bootstrap-ci) has Key Vault Secrets User role.
  # --------------------------------------------------------------------------
  - task: AzureKeyVault@2
    displayName: 'Fetch azdo-pat from Key Vault'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      KeyVaultName: $(kvName)
      SecretsFilter: 'azdo-pat'

  # --------------------------------------------------------------------------
  # Refresh the state file from live Azure resources before planning.
  # Uses run.sh --refresh which handles tofu installation and backend init.
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Refresh Terraform state from Azure'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/src/terraform/main"
        chmod +x ./run.sh
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_OIDC="true"
        export TF_INPUT="false"
        ./run.sh --refresh --env staging
    env:
      AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
      AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)
      TF_VAR_location: $(TF_VAR_location)
      TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)

  # --------------------------------------------------------------------------
  # Run tofu plan.  The state is now fully in sync with Azure.
  # --------------------------------------------------------------------------
  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/src/terraform/main"
        chmod +x ./run.sh
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_OIDC="true"
        export TF_INPUT="false"
        ./run.sh --plan --env staging
    env:
      AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
      AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)
      TF_VAR_location: $(TF_VAR_location)
      TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)