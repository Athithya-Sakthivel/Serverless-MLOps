# ---------------------------------------------------------------------------
# CI – Terraform Plan & Validate
#
# Runs `tofu plan` – does NOT apply.  Publishes plan artifact for audit.
# Uses the `terraform-vars` variable group (created by bootstrap) for the
# Azure DevOps PAT and organisation URL.  No Key Vault fetch is needed at
# this stage; the PAT is already stored as a secret in the variable group.
# ---------------------------------------------------------------------------

trigger:
  batch: true
  branches:
    include:
      - main
      - feat/*
  paths:
    include:
      - src/terraform/main/**
      - azure-pipelines/ci/ci-terraform.yaml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: terraform-vars          # Created by bootstrap – contains TF_VAR_location,
                                   # TF_VAR_alert_email_address, AZDO_ORG_SERVICE_URL,
                                   # and the secret AZDO_PERSONAL_ACCESS_TOKEN

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: AzureCLI@2
    displayName: 'Terraform plan'
    inputs:
      azureSubscription: 'azdo-oidc-ci'
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        cd "$(Build.SourcesDirectory)/src/terraform/main"
        chmod +x ./run.sh

        # OIDC credentials injected by AzureCLI task
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_USE_OIDC="true"
        export TF_INPUT="false"

        ./run.sh --plan --env staging
    env:
      # Inject non‑secret config and the PAT from the variable group into the shell
      AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
      AZDO_PERSONAL_ACCESS_TOKEN: $(AZDO_PERSONAL_ACCESS_TOKEN)

  # Publish plan for audit – CD does NOT use this artifact
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Terraform plan (audit only)'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/src/terraform/main/.plans/staging'
      artifact: 'terraform-plan'