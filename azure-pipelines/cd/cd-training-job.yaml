# =============================================================================
# CD – Training Job
#
# Triggered by the ML Training CI pipeline succeeding on main.
# Builds the training image, scans it with Trivy, pushes to ACR, then
# updates the training job's image tag.
# =============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ciMlTraining
      source: Serverless-MLOps-ml-training-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars

stages:
  - stage: build
    displayName: 'Build & Push Training Image'
    jobs:
      - job: build_push
        displayName: 'Build, scan and push training container'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          # ------------------------------------------------------------------
          # Debug: verify that the variable group is authorized and the ACR
          # name is resolving correctly.  If this step shows an empty value
          # or "containerRegistry = $(containerRegistry)" literally, the
          # variable group sm-all-vars has not been authorized for this
          # pipeline.
          # ------------------------------------------------------------------
          - bash: |
              echo "=== Variable resolution ==="
              echo "containerRegistry (macro) = $(containerRegistry)"
              echo "CONTAINER_REGISTRY (env)  = ${CONTAINER_REGISTRY:-UNSET}"
              echo ""
              echo "=== All relevant variables from sm-all-vars ==="
              env | sort | grep -E '^(containerRegistry|AZURE_|MLFLOW|CONTAINER_|STAGING|PROD_|FUNCTION_|TRAIN_)' || echo "(none found)"
              echo ""
              echo "=== Azure CLI account ==="
              az account show -o table 2>/dev/null || echo "(not logged in yet)"
              echo ""
              echo "=== Listing all ACRs in subscription ==="
              az acr list --query "[].{name:name,resourceGroup:resourceGroup,location:location}" -o table 2>/dev/null || echo "(no ACRs found or no access)"
            displayName: 'Debug: verify variables and ACR access'
            env:
              CONTAINER_REGISTRY: $(containerRegistry)

          - task: AzureCLI@2
            name: buildOutput
            displayName: 'Build, scan & push training container'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                LOGIN_SERVER="$(az acr show --name "$CONTAINER_REGISTRY" --query loginServer -o tsv)"
                IMAGE_TAG="training-${BUILD_SOURCE_VERSION}"
                FULL_IMAGE="${LOGIN_SERVER}/training:${IMAGE_TAG}"

                echo "##[section]Building training image: ${FULL_IMAGE}"
                az acr login --name "$CONTAINER_REGISTRY"
                docker build \
                  -f src/workloads/training_pipeline/Dockerfile \
                  -t "${FULL_IMAGE}" \
                  src/workloads/training_pipeline

                echo "##[section]Scanning image with Trivy (CRITICAL only)"
                TRIVY_VERSION="0.72.0"
                curl -fsSL --retry 3 --connect-timeout 10 \
                  -o /tmp/trivy.tar.gz \
                  "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
                chmod +x /tmp/trivy

                /tmp/trivy image \
                  --severity CRITICAL \
                  --exit-code 1 \
                  "${FULL_IMAGE}"

                echo "##[section]Pushing image: ${FULL_IMAGE}"
                docker push "${FULL_IMAGE}"

                echo "##vso[task.setvariable variable=trainingImage;isOutput=true]${FULL_IMAGE}"
            env:
              CONTAINER_REGISTRY: $(containerRegistry)
              BUILD_SOURCE_VERSION: $(Build.SourceVersion)

  - stage: staging
    displayName: 'Deploy to Staging'
    dependsOn: build
    condition: succeeded()
    variables:
      trainingImage: $[ stageDependencies.build.build_push.outputs['buildOutput.trainingImage'] ]
    jobs:
      - job: deploy_staging
        displayName: 'Update ACA Job – Staging'
        steps:
          - task: AzureCLI@2
            displayName: 'Update training job image'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az extension add --name containerapp --upgrade --yes 2>/dev/null || true

                echo "Updating training job image to: ${TRAINING_IMAGE}"
                az containerapp job update \
                  --name "${CONTAINER_APP_JOB_NAME}" \
                  --resource-group "${STAGING_RG}" \
                  --image "${TRAINING_IMAGE}" \
                  --output none

                echo "Staging deployment complete."
            env:
              CONTAINER_APP_JOB_NAME: $(CONTAINER_APP_JOB_NAME)
              STAGING_RG: $(STAGING_RG)
              TRAINING_IMAGE: $(trainingImage)