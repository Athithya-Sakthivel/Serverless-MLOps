# ---------------------------------------------------------------------------
# CD – Training Job
#
# Triggered by CI success for ELT or training code.
# Builds the training image (if code changed), scans, pushes to ACR,
# then updates the ACA Job in staging → manual approval → production.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciElt
      source: ci-elt
      trigger:
        branches:
          include:
            - main
    - pipeline: ciMlTraining
      source: ci-ml-training
      trigger:
        branches:
          include:
            - main

parameters:
  - name: deployELT
    type: boolean
    default: true
  - name: deployML
    type: boolean
    default: true

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars                              # contains CONTAINER_APP_JOB_NAME, containerRegistry, etc.

stages:
  - stage: build
    displayName: 'Build & Push Training Image'
    jobs:
      - ${{ if or(parameters.deployELT, parameters.deployML) }}:
        - job: build_push
          displayName: 'Build and push training image'
          steps:
            - checkout: self

            - task: AzureCLI@2
              displayName: 'Build & push training container'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail

                  LOGIN_SERVER="$(az acr show --name $(containerRegistry) --query loginServer -o tsv)"
                  IMAGE_TAG="training-$(Build.SourceVersion)"

                  az acr login -n $(containerRegistry)
                  docker build \
                    -f src/workloads/training_pipeline/Dockerfile \
                    -t "${LOGIN_SERVER}/training:${IMAGE_TAG}" \
                    .
                  docker push "${LOGIN_SERVER}/training:${IMAGE_TAG}"

                  echo "##vso[task.setvariable variable=trainingImage;isOutput=true]${LOGIN_SERVER}/training:${IMAGE_TAG}"
                addSpnToEnvironment: true
              name: buildOutput

  - stage: staging
    displayName: 'Deploy to Staging'
    dependsOn: build
    jobs:
      - deployment: deploy_staging
        displayName: 'Update ACA Job – Staging'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /azure-pipelines/templates/aca-deploy.yaml
                  parameters:
                    containerAppJobName: $(CONTAINER_APP_JOB_NAME)      # e.g. acaj-train-stg
                    resourceGroup: $(STAGING_RG)
                    image: $[ dependencies.build.outputs['buildOutput.trainingImage'] ]
                    azureServiceConnection: 'azdo-oidc-cd'

  - stage: production
    displayName: 'Deploy to Production'
    dependsOn: staging
    condition: succeeded()
    jobs:
      - deployment: deploy_prod
        displayName: 'Update ACA Job – Production'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /azure-pipelines/templates/aca-deploy.yaml
                  parameters:
                    containerAppJobName: $(CONTAINER_APP_JOB_NAME)-prod   # adjust if naming differs
                    resourceGroup: $(PROD_RG)
                    image: $[ dependencies.build.outputs['buildOutput.trainingImage'] ]
                    azureServiceConnection: 'azdo-oidc-cd'