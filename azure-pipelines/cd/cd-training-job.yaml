# =============================================================================
# CD – Training Job (staging only, no approvals)
#
# Triggered when either the ELT CI or ML‑Training CI pipeline succeeds on
# main.  Builds the training image, scans it, pushes to ACR, ensures the
# job identity has AcrPull, then updates the training job's image tag.
# =============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ciElt
      source: Serverless-MLOps-elt-ci
      trigger:
        branches:
          include:
            - main
    - pipeline: ciMlTraining
      source: Serverless-MLOps-ml-training-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars            # Contains containerRegistry, STAGING_RG, CONTAINER_APP_JOB_NAME, etc.

stages:
  # --------------------------------------------------------------------------
  # Stage 1 – Build, scan, and push the training image
  # --------------------------------------------------------------------------
  - stage: build
    displayName: 'Build & Push Training Image'
    jobs:
      - job: build_push
        displayName: 'Build, scan and push training container'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: AzureCLI@2
            name: buildOutput
            displayName: 'Build, scan & push training image'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                LOGIN_SERVER="$(az acr show --name "$CONTAINER_REGISTRY" --query loginServer -o tsv)"
                IMAGE_TAG="training-${BUILD_SOURCE_VERSION}"
                FULL_IMAGE="${LOGIN_SERVER}/training:${IMAGE_TAG}"

                echo "##[section]Building training image: ${FULL_IMAGE}"
                az acr login --name "$CONTAINER_REGISTRY"
                docker build \
                  -f src/workloads/training_pipeline/Dockerfile \
                  -t "${FULL_IMAGE}" \
                  src/workloads/training_pipeline

                echo "##[section]Scanning image with Trivy (CRITICAL only)"
                TRIVY_VERSION="0.72.0"
                curl -fsSL --retry 3 --connect-timeout 10 \
                  -o /tmp/trivy.tar.gz \
                  "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
                chmod +x /tmp/trivy

                /tmp/trivy image \
                  --severity CRITICAL \
                  --exit-code 1 \
                  "${FULL_IMAGE}"

                echo "##[section]Pushing image: ${FULL_IMAGE}"
                docker push "${FULL_IMAGE}"

                echo "##vso[task.setvariable variable=trainingImage;isOutput=true]${FULL_IMAGE}"
            env:
              CONTAINER_REGISTRY: $(containerRegistry)
              BUILD_SOURCE_VERSION: $(Build.SourceVersion)

  # --------------------------------------------------------------------------
  # Stage 2 – Deploy to staging (idempotent)
  # --------------------------------------------------------------------------
  - stage: staging
    displayName: 'Deploy to Staging'
    dependsOn: build
    condition: succeeded()
    variables:
      trainingImage: $[ stageDependencies.build.build_push.outputs['buildOutput.trainingImage'] ]
    jobs:
      - job: deploy_staging
        displayName: 'Update ACA Job – Staging'
        steps:
          # ------------------------------------------------------------------
          # Step 1 – Ensure the job's managed identity can pull from ACR.
          # ------------------------------------------------------------------
          - task: AzureCLI@2
            displayName: 'Ensure job has AcrPull role'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az extension add --name containerapp --upgrade --yes 2>/dev/null || true

                # Derive subscription ID from the active Azure CLI session
                SUB_ID="$(az account show --query id -o tsv)"

                JOB_PRINCIPAL=$(az containerapp job show \
                  --name "${CONTAINER_APP_JOB_NAME}" \
                  --resource-group "${STAGING_RG}" \
                  --query "identity.principalId" -o tsv)

                ACR_ID="/subscriptions/${SUB_ID}/resourceGroups/${STAGING_RG}/providers/Microsoft.ContainerRegistry/registries/${CONTAINER_REGISTRY}"

                EXISTING=$(az role assignment list \
                  --assignee "$JOB_PRINCIPAL" \
                  --role "AcrPull" \
                  --scope "$ACR_ID" \
                  --query "[0].id" -o tsv 2>/dev/null || true)

                if [[ -z "$EXISTING" ]]; then
                  echo "Assigning AcrPull to job identity..."
                  az role assignment create \
                    --assignee-object-id "$JOB_PRINCIPAL" \
                    --assignee-principal-type ServicePrincipal \
                    --role "AcrPull" \
                    --scope "$ACR_ID" \
                    --output none
                  echo "AcrPull assigned. Waiting 30s for propagation..."
                  sleep 30
                else
                  echo "AcrPull already assigned."
                fi
            env:
              CONTAINER_APP_JOB_NAME: $(CONTAINER_APP_JOB_NAME)
              STAGING_RG: $(STAGING_RG)
              CONTAINER_REGISTRY: $(containerRegistry)

          # ------------------------------------------------------------------
          # Step 2 – Update the training job image.
          # ------------------------------------------------------------------
          - task: AzureCLI@2
            displayName: 'Update training job image'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az extension add --name containerapp --upgrade --yes 2>/dev/null || true

                echo "Updating training job image to: ${TRAINING_IMAGE}"
                az containerapp job update \
                  --name "${CONTAINER_APP_JOB_NAME}" \
                  --resource-group "${STAGING_RG}" \
                  --image "${TRAINING_IMAGE}" \
                  --output none

                echo "Staging deployment complete."
            env:
              CONTAINER_APP_JOB_NAME: $(CONTAINER_APP_JOB_NAME)
              STAGING_RG: $(STAGING_RG)
              TRAINING_IMAGE: $(trainingImage)