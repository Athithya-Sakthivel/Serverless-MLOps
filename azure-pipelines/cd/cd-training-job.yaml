# ---------------------------------------------------------------------------
# CD – Training Job
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciElt
      source: ci-elt
      trigger:
        branches:
          include:
            - main
    - pipeline: ciMlTraining
      source: ci-ml-training
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars

stages:
  - stage: build
    displayName: 'Build & Push Training Image'
    jobs:
      - job: build_push
        displayName: 'Build and push training image'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Build & push training container'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                LOGIN_SERVER="$(az acr show --name $(containerRegistry) --query loginServer -o tsv)"
                IMAGE_TAG="training-$(Build.SourceVersion)"

                az acr login -n $(containerRegistry)
                docker build \
                  -f src/workloads/training_pipeline/Dockerfile \
                  -t "${LOGIN_SERVER}/training:${IMAGE_TAG}" \
                  .
                docker push "${LOGIN_SERVER}/training:${IMAGE_TAG}"

                echo "##vso[task.setvariable variable=trainingImage;isOutput=true]${LOGIN_SERVER}/training:${IMAGE_TAG}"
            addSpnToEnvironment: true
          name: buildOutput

  - stage: staging
    displayName: 'Deploy to Staging'
    dependsOn: build
    jobs:
      - deployment: deploy_staging
        displayName: 'Update ACA Job – Staging'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Update training job (staging)'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp job update \
                        --name "$(CONTAINER_APP_JOB_NAME_STAGING)" \
                        --resource-group "$(STAGING_RG)" \
                        --image "$(trainingImage)" \
                        --output none
                  env:
                    trainingImage: $[ dependencies.build.outputs['buildOutput.trainingImage'] ]

  - stage: production
    displayName: 'Deploy to Production'
    dependsOn: staging
    condition: succeeded()
    jobs:
      - deployment: deploy_prod
        displayName: 'Update ACA Job – Production'
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Update training job (production)'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az containerapp job update \
                        --name "$(CONTAINER_APP_JOB_NAME_PROD)" \
                        --resource-group "$(PROD_RG)" \
                        --image "$(trainingImage)" \
                        --output none
                  env:
                    trainingImage: $[ dependencies.build.outputs['buildOutput.trainingImage'] ]