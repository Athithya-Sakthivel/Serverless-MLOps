# =============================================================================
# CD – Training Job (staging only, no approvals)
#
# Triggered automatically when **either** the ELT CI or the ML-Training CI
# pipeline succeeds on `main`.  This ensures a single code change that touches
# both domains only triggers one deployment.
#
# Stages:
#   1. Build, vulnerability‑scan, and push the training container image.
#   2. Deploy to staging using the full job YAML (preserves event trigger).
# =============================================================================

trigger: none                              # triggered by CI completion, not commits

resources:
  pipelines:
    - pipeline: ciElt
      source: Serverless-MLOps-elt-ci
      trigger:
        branches:
          include:
            - main
    - pipeline: ciMlTraining
      source: Serverless-MLOps-ml-training-ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-24.04

# The Terraform‑managed variable group `sm-all-vars` contains every non‑secret
# configuration value (storage account, MLflow URI, queue names, etc.).
variables:
  - group: sm-all-vars

stages:
  # --------------------------------------------------------------------------
  # Stage 1 – Build, scan, and push the training image
  # --------------------------------------------------------------------------
  - stage: build
    displayName: 'Build & Push Training Image'
    jobs:
      - job: build_push
        displayName: 'Build, scan and push training container'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: AzureCLI@2
            name: buildOutput
            displayName: 'Build, scan & push training container'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # ---- 1. Assemble the full image reference ----
                LOGIN_SERVER="$(az acr show --name "$CONTAINER_REGISTRY" --query loginServer -o tsv)"
                IMAGE_TAG="training-${BUILD_SOURCE_VERSION}"
                FULL_IMAGE="${LOGIN_SERVER}/training:${IMAGE_TAG}"

                echo "##[section]Building training image: ${FULL_IMAGE}"
                az acr login --name "$CONTAINER_REGISTRY"
                docker build \
                  -f src/workloads/training_pipeline/Dockerfile \
                  -t "${FULL_IMAGE}" \
                  src/workloads/training_pipeline

                # ---- 2. Trivy vulnerability scan (block on CRITICAL) ----
                echo "##[section]Scanning image with Trivy (CRITICAL)"
                TRIVY_VERSION="0.72.0"
                curl -fsSL --retry 3 --connect-timeout 10 \
                  -o /tmp/trivy.tar.gz \
                  "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
                chmod +x /tmp/trivy

                /tmp/trivy image \
                  --severity CRITICAL \
                  --exit-code 1 \
                  "${FULL_IMAGE}"

                # ---- 3. Push the clean image ----
                echo "##[section]Pushing image: ${FULL_IMAGE}"
                docker push "${FULL_IMAGE}"

                # Pass the full image reference to the next stage
                echo "##vso[task.setvariable variable=trainingImage;isOutput=true]${FULL_IMAGE}"
            env:
              CONTAINER_REGISTRY: $(containerRegistry)
              BUILD_SOURCE_VERSION: $(Build.SourceVersion)

  # --------------------------------------------------------------------------
  # Stage 2 – Deploy to staging (automatic, preserves event trigger)
  # --------------------------------------------------------------------------
  - stage: staging
    displayName: 'Deploy to Staging'
    dependsOn: build
    condition: succeeded()
    variables:
      trainingImage: $[ stageDependencies.build.build_push.outputs['buildOutput.trainingImage'] ]
    jobs:
      - job: deploy_staging
        displayName: 'Update ACA Job – Staging'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: AzureCLI@2
            displayName: 'Update training job (preserve event trigger)'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Ensure the Container Apps CLI extension is installed
                az extension add --name containerapp --upgrade --yes 2>/dev/null || true

                # ---- 1. Export every value the YAML template requires ----
                export STORAGE_ACCOUNT_NAME="$AZURE_STORAGE_ACCOUNT_NAME"
                export STORAGE_QUEUE_NAME="$STORAGE_QUEUE_NAME"
                export MLFLOW_TRACKING_URI="$MLFLOW_TRACKING_URI"
                export AZUREML_WORKSPACE_ID="$AZUREML_WORKSPACE_ID"
                export TRAINING_IMAGE="$TRAINING_IMAGE"

                # ---- 2. Generate a concrete YAML from the template ----
                JOB_YAML="$(Agent.TempDirectory)/job.yaml"
                envsubst < src/workloads/training_pipeline/aca-job.yaml > "$JOB_YAML"

                echo "##[section]Applying complete job definition..."
                az containerapp job update \
                  --name "$CONTAINER_APP_JOB_NAME_STAGING" \
                  --resource-group "$STAGING_RG" \
                  --yaml "$JOB_YAML" \
                  --output none

                echo "Staging deployment complete. Event trigger and all env vars preserved."
            env:
              # Pipeline variables mapped to the inline script environment
              CONTAINER_APP_JOB_NAME_STAGING: $(CONTAINER_APP_JOB_NAME)
              STAGING_RG: $(STAGING_RG)
              TRAINING_IMAGE: $(trainingImage)
              AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
              STORAGE_QUEUE_NAME: $(STORAGE_QUEUE_NAME)
              MLFLOW_TRACKING_URI: $(MLFLOW_TRACKING_URI)
              AZUREML_WORKSPACE_ID: $(AZUREML_WORKSPACE_ID)