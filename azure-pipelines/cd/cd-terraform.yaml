# =============================================================================
# CD – Terraform Apply (manual trigger)
#
# Single‑phase deployment.  Terraform creates all infrastructure, then
# run.sh creates/heals the Container Apps, assigns RBAC roles, deploys the
# Function code, and creates the Event Grid subscription.
#
# The Azure DevOps PAT is fetched from the bootstrap Key Vault at runtime.
# =============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ciTerraform
      source: Serverless-MLOps-terraform-ci
      branch: main
      trigger: none

pool:
  vmImage: ubuntu-24.04

variables:
  - group: terraform-vars

jobs:
  - deployment: apply_terraform
    displayName: 'Apply Terraform – Staging'
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true
              fetchDepth: 1

            # Derive the bootstrap Key Vault name (authenticated)
            - task: AzureCLI@2
              displayName: 'Derive Key Vault name'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  KV_NAME="kv-azdo-bootstrap-${SUBSCRIPTION_ID: -6}"
                  echo "Key Vault: ${KV_NAME}"
                  echo "##vso[task.setvariable variable=kvName]${KV_NAME}"

            # Fetch the Azure DevOps PAT from Key Vault
            - task: AzureKeyVault@2
              displayName: 'Fetch azdo-pat from Key Vault'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                KeyVaultName: $(kvName)
                SecretsFilter: 'azdo-pat'

            # Single‑phase deploy
            - task: AzureCLI@2
              displayName: 'Deploy infrastructure + Container Apps + Function + Event Grid'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)
                TF_VAR_location: $(TF_VAR_location)
                TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)