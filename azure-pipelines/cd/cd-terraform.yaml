# =============================================================================
# CD – Terraform Apply (manual trigger)
#
# Single‑phase deployment.  Terraform creates all infrastructure (ACA
# environment, storage, ACR, ML workspace, Function App, Azure DevOps
# resources).  run.sh then creates the serving app and training job via
# Azure CLI (avoiding ARM timeouts), assigns all RBAC roles, deploys the
# Function code, and creates the Event Grid subscription.
#
# The Azure DevOps PAT is fetched from Key Vault at runtime.  No secrets
# are stored in variable groups.
# =============================================================================

trigger: none                # Manual only – triggered from the Azure DevOps UI

resources:
  pipelines:
    - pipeline: ciTerraform
      source: Serverless-MLOps-terraform-ci
      branch: main
      trigger: none

pool:
  vmImage: ubuntu-24.04

variables:
  # Non‑secret configuration still comes from the variable group.
  # The PAT is fetched from Key Vault and is NOT stored in this group.
  - group: terraform-vars

jobs:
  - deployment: apply_terraform
    displayName: 'Apply Terraform – Staging'
    environment: staging           # Requires manual approval defined in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true
              fetchDepth: 1

            # ----------------------------------------------------------------
            # Step 1 – Determine the bootstrap Key Vault name.
            # The bootstrap Key Vault always follows the naming pattern
            #   kv-azdo-bootstrap-<subscription-suffix>
            # We derive it from the active subscription ID.
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Resolve bootstrap Key Vault name'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail

                  SUB_ID="$(az account show --query id -o tsv)"
                  SUFFIX="${SUB_ID: -6}"
                  KV_NAME="kv-azdo-bootstrap-${SUFFIX}"

                  echo "Bootstrap Key Vault name: ${KV_NAME}"
                  echo "##vso[task.setvariable variable=bootstrapKvName;issecret=false]${KV_NAME}"

            # ----------------------------------------------------------------
            # Step 2 – Fetch the Azure DevOps PAT from Key Vault.
            # The CD service principal (bootstrap-cd) already has the
            # "Key Vault Secrets User" role on the bootstrap Key Vault.
            # The secret is exposed as a pipeline variable $(azdo-pat).
            # ----------------------------------------------------------------
            - task: AzureKeyVault@2
              displayName: 'Fetch azdo-pat from Key Vault'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                KeyVaultName: '$(bootstrapKvName)'
                SecretsFilter: 'azdo-pat'
                RunAsPreJob: false

            # ----------------------------------------------------------------
            # Step 3 – Run the full deployment.
            # The PAT fetched from Key Vault is injected into the environment
            # as AZDO_PERSONAL_ACCESS_TOKEN, which the azuredevops Terraform
            # provider and run.sh both expect.
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Deploy infrastructure + Container Apps + Function + Event Grid'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging
              env:
                # Non‑secret config from the variable group
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                TF_VAR_location: $(TF_VAR_location)
                TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)
                # PAT fetched from Key Vault
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)