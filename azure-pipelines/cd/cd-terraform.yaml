# =============================================================================
# CD – Terraform Apply (manual trigger)
#
# Two‑phase deployment.  Phase 1 creates the ACA environment and all other
# infrastructure.  Phase 2 creates the serving app and training job via Azure
# CLI, heals them, assigns RBAC, deploys the Function, and creates the Event
# Grid subscription.
#
# The Azure DevOps PAT is fetched from Key Vault at runtime.
# =============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ciTerraform
      source: Serverless-MLOps-terraform-ci
      branch: main
      trigger: none

pool:
  vmImage: ubuntu-24.04

variables:
  - group: terraform-vars          # AZDO_ORG_SERVICE_URL, TF_VAR_location, TF_VAR_alert_email_address

jobs:
  - deployment: apply_terraform
    displayName: 'Apply Terraform – Staging'
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true
              fetchDepth: 1

            # ----------------------------------------------------------------
            # Resolve the bootstrap Key Vault name from the subscription suffix
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Resolve bootstrap Key Vault name'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  SUB_ID="$(az account show --query id -o tsv)"
                  KV_NAME="kv-azdo-bootstrap-${SUB_ID: -6}"
                  echo "##vso[task.setvariable variable=bootstrapKvName]${KV_NAME}"

            # ----------------------------------------------------------------
            # Fetch the Azure DevOps PAT from Key Vault
            # ----------------------------------------------------------------
            - task: AzureKeyVault@2
              displayName: 'Fetch azdo-pat from Key Vault'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                KeyVaultName: '$(bootstrapKvName)'
                SecretsFilter: 'azdo-pat'

            # ----------------------------------------------------------------
            # Phase 1 – Infrastructure only (no Container Apps)
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 1 – Infrastructure (skip ACA)'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging --skip-aca
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)
                TF_VAR_location: $(TF_VAR_location)
                TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)

            # ----------------------------------------------------------------
            # Phase 2 – Full deploy (serving app, training job, Function, Event Grid)
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 2 – Full deploy with ACA + Function + Event Grid'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)
                TF_VAR_location: $(TF_VAR_location)
                TF_VAR_alert_email_address: $(TF_VAR_alert_email_address)