# ---------------------------------------------------------------------------
# CD – Terraform Apply (manual trigger)
#
# Applies the exact plan from CI.  No re‑plan.  PAT fetched from Key Vault.
# ---------------------------------------------------------------------------

trigger: none                                      # Manual only

resources:
  pipelines:
    - pipeline: ciTerraform
      source: Serverless-MLOps-terraform-ci
      branch: main
      trigger: none

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars
  - name: kvName
    value: 'kv-bootstrap-${TF_VAR_subscription_id_suffix}'   # adjust as needed

jobs:
  - deployment: apply_terraform
    displayName: 'Plan and apply Terraform'
    environment: staging                          # requires manual approval defined in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true
              fetchDepth: 1

            # ----------------------------------------------------------------
            # Fetch the Azure DevOps PAT
            # ----------------------------------------------------------------
            - task: AzureKeyVault@2
              displayName: 'Fetch azdo-pat from Key Vault'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                KeyVaultName: $(kvName)
                SecretsFilter: 'azdo-pat'
                RunAsPreJob: true

            # ----------------------------------------------------------------
            # Phase 1 – Infrastructure only (skip ACA)
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 1 – Infrastructure (skip ACA)'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh

                  export ARM_CLIENT_ID="${servicePrincipalId}"
                  export ARM_TENANT_ID="${tenantId}"
                  export ARM_OIDC_TOKEN="${idToken}"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"

                  ./run.sh --create --env staging --skip-aca
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)

            # ----------------------------------------------------------------
            # Phase 2 – Full deploy including ACA (environment is warm)
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 2 – Full deploy with ACA'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh

                  export ARM_CLIENT_ID="${servicePrincipalId}"
                  export ARM_TENANT_ID="${tenantId}"
                  export ARM_OIDC_TOKEN="${idToken}"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"

                  ./run.sh --create --env staging
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(azdo-pat)