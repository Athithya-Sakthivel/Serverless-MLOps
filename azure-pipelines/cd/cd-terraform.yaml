# =============================================================================
# CD – Terraform Apply (manual trigger)
#
# Two‑phase deployment to avoid student‑subscription timeouts:
#   Phase 1 provisions everything except Container Apps so the ACA environment
#           is created and warm.
#   Phase 2 deploys the training job and serving app into the warm environment,
#           heals the job if it failed to provision, then deploys the Azure
#           Function blob trigger.
# =============================================================================

trigger: none                # Manual only – triggered from the Azure DevOps UI

resources:
  pipelines:
    - pipeline: ciTerraform
      source: Serverless-MLOps-terraform-ci
      branch: main
      trigger: none

pool:
  vmImage: ubuntu-24.04

# Non‑secret configuration and the Azure DevOps PAT are in terraform‑vars
variables:
  - group: terraform-vars

jobs:
  - deployment: apply_terraform
    displayName: 'Apply Terraform – Staging'
    environment: staging         # Requires manual approval defined in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              clean: true
              fetchDepth: 1

            # ----------------------------------------------------------------
            # Phase 1 – Infrastructure only (no Container Apps)
            # Creates the resource group, storage, ACR, Log Analytics, ML
            # workspace, Function App, and the ACA environment.
            # The ACA environment is warm after this phase, making Phase 2
            # faster and less likely to time out.
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 1 – Infrastructure (skip ACA)'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging --skip-aca
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(AZDO_PERSONAL_ACCESS_TOKEN)

            # ----------------------------------------------------------------
            # Phase 2 – Full deploy including Container Apps
            # Creates the serving app and training job, heals the job if it
            # failed to provision (student‑subscription timeout), then deploys
            # the Azure Function blob trigger code.
            # ----------------------------------------------------------------
            - task: AzureCLI@2
              displayName: 'Phase 2 – Full deploy with ACA + Function'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                addSpnToEnvironment: true
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  cd "$(Build.SourcesDirectory)/src/terraform/main"
                  chmod +x ./run.sh
                  export ARM_CLIENT_ID="$servicePrincipalId"
                  export ARM_TENANT_ID="$tenantId"
                  export ARM_OIDC_TOKEN="$idToken"
                  export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                  export ARM_USE_OIDC="true"
                  export TF_IN_AUTOMATION="true"
                  ./run.sh --create --env staging
              env:
                AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                AZDO_PERSONAL_ACCESS_TOKEN: $(AZDO_PERSONAL_ACCESS_TOKEN)