# ---------------------------------------------------------------------------
# CD – Serving API (Canary Deployment)
#
# Two modes:
#   a) Code change: build new serving image, then canary deploy.
#   b) Model promotion: change MODEL_VERSION env var without rebuild.
#
# The canary deployment logic is entirely in src/scripts/canary-deploy.sh.
# A rollback webhook secret is fetched from Key Vault and passed to the
# script so it can trigger a rollback notification if needed.
# This pipeline does NOT use the Azure DevOps PAT.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciService
      source: ci-service
      trigger:
        branches:
          include:
            - main

parameters:
  - name: modelVersion
    displayName: 'Model version to promote'
    type: string
    default: ''

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars

stages:
  - stage: canary
    displayName: 'Canary Deployment'
    jobs:
      - deployment: canary_deploy
        displayName: 'Run canary deployment'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                # Derive the bootstrap Key Vault name (authenticated)
                - task: AzureCLI@2
                  displayName: 'Derive Key Vault name'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      KV_NAME="kv-azdo-bootstrap-${SUBSCRIPTION_ID: -6}"
                      echo "Key Vault: ${KV_NAME}"
                      echo "##vso[task.setvariable variable=kvName]${KV_NAME}"

                # Fetch the rollback webhook from Key Vault
                - task: AzureKeyVault@2
                  displayName: 'Fetch rollback-webhook from Key Vault'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    KeyVaultName: $(kvName)
                    SecretsFilter: 'rollback-webhook'

                - task: AzureCLI@2
                  displayName: 'Canary deployment'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: 'src/scripts/canary-deploy.sh'
                    arguments: >
                      --app-name $(CONTAINER_APP_NAME)
                      --resource-group $(STAGING_RG)
                      ${{ if parameters.modelVersion }}
                        --model-version ${{ parameters.modelVersion }}
                      ${{ else }}
                        --image $(containerRegistry).azurecr.io/serving:$(Build.SourceVersion)
                      ${{ endif }}
                      --canary-steps 10,50
                      --k6-script tests/load/k6-script.js
                  env:
                    ROLLBACK_WEBHOOK: $(rollback-webhook)