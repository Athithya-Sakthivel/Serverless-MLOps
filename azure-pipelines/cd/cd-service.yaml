# ---------------------------------------------------------------------------
# CD – Serving API (Canary Deployment)
#
# Two modes:
#   a) Code change: build new serving image, then canary deploy.
#   b) Model promotion: change MODEL_VERSION env var without rebuild.
# The canary deployment logic is entirely in src/scripts/canary-deploy.sh.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciService
      source: ci-service
      trigger:
        branches:
          include:
            - main

parameters:
  - name: mode
    type: string
    default: 'code'              # 'code' = build+deploy, 'model' = only update MODEL_VERSION
  - name: modelVersion
    type: string
    default: ''
  - name: canarySteps
    type: object
    default: [10, 50]           # traffic percentages

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars           # contains CONTAINER_APP_NAME, containerRegistry, STAGING_RG, etc.

stages:
  - stage: staging
    displayName: 'Canary Deploy to Staging'
    jobs:
      - job: canary_staging
        displayName: 'Canary deployment – staging'
        steps:
          - checkout: self

          # ------------------------------------------------------------------
          # If mode == 'code', build the serving image
          # ------------------------------------------------------------------
          - ${{ if eq(parameters.mode, 'code') }}:
            - task: AzureCLI@2
              displayName: 'Build & push serving image'
              inputs:
                azureSubscription: 'azdo-oidc-cd'
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail

                  LOGIN_SERVER="$(az acr show --name $(containerRegistry) --query loginServer -o tsv)"
                  IMAGE_TAG="serve-$(Build.SourceVersion)"

                  az acr login -n $(containerRegistry)
                  docker build \
                    -f src/workloads/serving/Dockerfile \
                    -t "${LOGIN_SERVER}/serving:${IMAGE_TAG}" \
                    .
                  docker push "${LOGIN_SERVER}/serving:${IMAGE_TAG}"

                  echo "##vso[task.setvariable variable=servingImage]${LOGIN_SERVER}/serving:${IMAGE_TAG}"
                addSpnToEnvironment: true

          # ------------------------------------------------------------------
          # Run canary deployment (image OR model update)
          # ------------------------------------------------------------------
          - task: AzureCLI@2
            displayName: 'Canary deploy to staging'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: 'src/scripts/canary-deploy.sh'
              arguments: >
                --app-name "$(CONTAINER_APP_NAME)"           # e.g. aca-serve-stg
                --resource-group "$(STAGING_RG)"
                ${{ if eq(parameters.mode, 'code') }}:
                  --image "$(servingImage)"
                ${{ else }}:
                  --model-version "${{ parameters.modelVersion }}"
                --canary-steps "${{ join(parameters.canarySteps, ',') }}"
                --k6-script "tests/load/k6-script.js"
                --health-path "/health"
                --ready-path "/ready"

  - stage: production
    displayName: 'Promote to Production'
    dependsOn: staging
    condition: succeeded()
    jobs:
      - job: canary_production
        displayName: 'Canary deployment – production'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Canary deploy to production'
            inputs:
              azureSubscription: 'azdo-oidc-cd'
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: 'src/scripts/canary-deploy.sh'
              arguments: >
                --app-name "$(CONTAINER_APP_NAME)"           # e.g. aca-serve-prod
                --resource-group "$(PROD_RG)"
                ${{ if eq(parameters.mode, 'code') }}:
                  --image "$(servingImage)"
                ${{ else }}:
                  --model-version "${{ parameters.modelVersion }}"
                --canary-steps "${{ join(parameters.canarySteps, ',') }}"
                --k6-script "tests/load/k6-script.js"
                --health-path "/health"
                --ready-path "/ready"