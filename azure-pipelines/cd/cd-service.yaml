# ---------------------------------------------------------------------------
# CD – Serving API (Canary Deployment)
#
# Two modes:
#   a) Code change: build new serving image, then canary deploy.
#   b) Model promotion: change MODEL_VERSION env var without rebuild.
# The canary deployment logic is entirely in src/scripts/canary-deploy.sh.
# ---------------------------------------------------------------------------

trigger: none

resources:
  pipelines:
    - pipeline: ciService
      source: ci-service
      trigger:
        branches:
          include:
            - main

parameters:
  - name: modelVersion
    displayName: 'Model version to promote'
    type: string
    default: ''                     # empty → image‑only update

pool:
  vmImage: ubuntu-24.04

variables:
  - group: sm-all-vars
  - name: kvName
    value: 'kv-smstgmlf41930' # should be replaced

stages:
  - stage: canary
    displayName: 'Canary Deployment'
    jobs:
      - deployment: canary_deploy
        displayName: 'Run canary deployment'
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureKeyVault@2
                  displayName: 'Fetch secrets from Key Vault'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    KeyVaultName: $(kvName)
                    SecretsFilter: 'azdo-pat'

                - task: AzureCLI@2
                  displayName: 'Canary deployment'
                  inputs:
                    azureSubscription: 'azdo-oidc-cd'
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: 'src/scripts/canary-deploy.sh'
                    arguments: >
                      --app-name $(CONTAINER_APP_NAME)
                      --resource-group $(STAGING_RG)
                      ${{ if parameters.modelVersion }}
                        --model-version ${{ parameters.modelVersion }}
                      ${{ else }}
                        --image $(containerRegistry).azurecr.io/serving:$(Build.SourceVersion)
                      ${{ endif }}
                      --canary-steps 10,50
                      --k6-script tests/load/k6-script.js
                  env:
                    AZURE_DEVOPS_EXT_PAT: $(azdo-pat)