# aca-job.yaml – Complete Azure Container App Job definition with event trigger
# Place this file under version control in src/workloads/training_pipeline/
properties:
  triggerType: Event
  configuration:
    replicaTimeoutInSeconds: 1800
    replicaRetryLimit: 1
    eventTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
      scale:
        minExecutions: 0
        maxExecutions: 1
        pollingIntervalInSeconds: 30
        rules:
          - name: training-queue
            type: azure-queue
            metadata:
              accountName: <STORAGE_ACCOUNT_NAME>   # e.g. smstgartifactsf41930
              queueName: <STORAGE_QUEUE_NAME>       # e.g. smtrainqueue-stg
              queueLength: "1"
  template:
    containers:
      - name: train
        image: PLACEHOLDER                         # replaced by CD pipeline
        resources:
          cpu: 2.0
          memory: "4Gi"
        command: ["sh", "-c"]
        args: ["python main.py"]                  # your actual entry point
        env:
          - name: MODE
            value: train
          - name: RAW_CONTAINER_NAME
            value: raw
          - name: CLEAN_CONTAINER_NAME
            value: clean
          - name: CHECKPOINT_CONTAINER_NAME
            value: checkpoints
          - name: STORAGE_ACCOUNT_NAME
            value: <STORAGE_ACCOUNT_NAME>
          - name: STORAGE_QUEUE_NAME
            value: <STORAGE_QUEUE_NAME>
          - name: MLFLOW_TRACKING_URI
            value: <MLFLOW_TRACKING_URI>
          - name: AZUREML_WORKSPACE_ID
            value: <AZUREML_WORKSPACE_ID>